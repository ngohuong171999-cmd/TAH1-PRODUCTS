<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product Specification | Tan Hoa 1 Co., Ltd.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{--bg:#FFFFFF;--cream:#FAF3E9;--ink:#000000;--gold:#BD9660;--mute:#000000b3;--line:#bd966066;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--cream:#17130d;--ink:#FAF3E9;--mute:#faf3e9b3}}
:root[data-theme="dark"]{--bg:#000000;--cream:#17130d;--ink:#FAF3E9;--mute:#faf3e9b3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Be Vietnam Pro",system-ui,"Segoe UI",sans-serif}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
header img{height:38px;width:auto;display:block}
.loc{font-size:13px;font-weight:500;text-align:right;line-height:1.3}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 8px;font:500 15px "Be Vietnam Pro",system-ui,sans-serif;color:var(--mute);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs button:focus-visible,summary:focus-visible,.car:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.panel[hidden]{display:none}
.stage{background:var(--cream);margin:16px 20px 8px;padding:12px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.stage img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.title{padding:8px 20px 4px}
.title h1{margin:0;font-size:18px;font-weight:600}
.title p{margin:2px 0 0;color:var(--mute);font-size:13px}
.acc{margin:12px 20px 0;border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:500;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;font-weight:400;color:var(--gold)}
details[open] summary::after{content:"–"}
details .body{padding:0 0 16px}
details .body p{margin:0 0 8px;white-space:pre-line}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
dt{color:var(--mute)}dd{margin:0;text-align:right}
.note{margin:20px;padding:12px 14px;background:var(--cream);border-left:3px solid var(--gold);font-size:13px}
.media{margin:16px 0 8px}
.media h2{margin:0 20px 10px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.media h2 small{font-weight:400;font-size:13px;color:var(--mute)}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.car figure{flex:0 0 100%;margin:0;padding:0 20px;scroll-snap-align:center}
.ph{aspect-ratio:1/1;background:var(--cream);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);font-size:13px;text-align:center;padding:12px}
.ph img,.ph video{width:100%;height:100%;object-fit:cover;display:block}
.car figcaption{margin-top:8px;font-size:13px;color:var(--mute)}
.vid{padding:0 20px}
.vid h2{margin-left:0;margin-right:0}
.vid .ph{aspect-ratio:16/9}
footer{margin-top:28px;background:var(--cream);border-top:3px solid var(--gold);padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));font-size:13px}
footer h3{margin:0 0 10px;font-size:14px;font-weight:600}
footer dl{grid-template-columns:auto 1fr;gap:8px 14px}
footer dt{color:var(--ink);font-weight:500;white-space:nowrap}
footer dd{text-align:left;color:var(--ink);word-break:break-word}
footer a{color:var(--ink);text-decoration-color:var(--gold);text-underline-offset:3px}
.social{display:flex;gap:12px;margin-top:16px}
.social a{width:44px;height:44px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center}
.social a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.social svg{width:22px;height:22px;fill:var(--ink)}
.state-box{padding:80px 20px;text-align:center;font-size:15px;color:var(--mute)}
</style>
</head>
